name: Release

# A kiadás a saját CI-jében készül el: a GITHUB_TOKEN a repóhoz tartozik,
# így nem kell külön PAT-jog a release-ek létrehozásához.
# Indul: a v* tag pusholásakor, vagy kézzel (workflow_dispatch).
#
# A kiadás címe és jegyzete a repó gyökerében lévő RELEASE.md fájlból jön
# (az első „# ” címsor a cím, a többi a jegyzet). Ha nincs ilyen fájl,
# a GitHub generált jegyzeteit használjuk.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'A kiadás tagje (pl. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # a kiadás szövege a main aktuális állapotából jön (a tag a kiadás
          # pillanatát jelöli, a szöveg viszont mindig a legfrissebb)
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: A tag meghatározása
        id: meta
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: A kiadás létrehozása vagy frissítése
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          TITLE="$TAG"
          NOTES=""
          if [ -f RELEASE.md ]; then
            TITLE="$(head -1 RELEASE.md | sed 's/^# *//')"
            NOTES="$(tail -n +2 RELEASE.md | sed '/./,$!d')"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A(z) $TAG kiadás már létezik – frissítem."
            if [ -n "$NOTES" ]; then
              gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            fi
          elif [ -n "$NOTES" ]; then
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --title "$TITLE" --generate-notes
          fi
          echo "Kész: $TAG – $TITLE"
